# Combined CI workflow: builds (but does not publish) a NuGet package and an
# npm package from the same repository. Meant for PR / branch validation, the
# counterpart to release.yml.

name: CI (NuGet + npm)

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: >-
          .NET SDK version(s) to install, passed to actions/setup-dotnet. Accepts several versions on
          separate lines (e.g. "10.0.x\n11.0.x") so a multi-targeting repository gets every SDK and
          runtime its build and tests need. A global.json in the repository still selects the SDK.
        required: false
        type: string
        default: '10.0.x'
      suffix:
        required: false
        type: string
      minimum-line-coverage:
        description: >-
          Fail the build when total line coverage, merged across every test project's Cobertura report,
          is below this percentage (e.g. 85). 0, the default, only reports coverage.
        required: false
        type: number
        default: 0
      npm-bundles:
        description: >-
          Prebuilt npm bundles to embed instead of building them during dotnet build: one
          "artifact-name=assets-dir" pair per line, where artifact-name is an artifact of this run holding
          an `npm pack` tarball and assets-dir is the npm package folder, relative to the repository root.
          Each tarball's dist/ is extracted into assets-dir/dist and touched, so MSBuild finds the bundle
          newer than its sources and skips the npm build. Empty (the default) changes nothing.
        required: false
        type: string
        default: ''
      build-nuget:
        description: 'Build the NuGet package.'
        required: false
        type: boolean
        default: true
      generate-schema:
        description: 'Use the schema-generating NuGet build instead of the plain one.'
        required: false
        type: boolean
        default: true
      build-npm:
        description: 'Build the npm package.'
        required: false
        type: boolean
        default: true
      working-directory:
        required: false
        type: string
        default: '.'
      node-version:
        required: false
        type: string
        default: '22.x'
      artifact-name:
        description: 'Name of the uploaded npm package artifact.'
        required: false
        type: string
        default: 'Npm Build Output'

jobs:
  build-nuget-schema:
    if: inputs.build-nuget && inputs.generate-schema
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/buildNugetPackage.yml@main
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      suffix: ${{ inputs.suffix }}
      minimum-line-coverage: ${{ inputs.minimum-line-coverage }}
      npm-bundles: ${{ inputs.npm-bundles }}

  build-nuget-noschema:
    if: inputs.build-nuget && !inputs.generate-schema
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/buildNugetPackageNoSchema.yml@main
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      suffix: ${{ inputs.suffix }}
      minimum-line-coverage: ${{ inputs.minimum-line-coverage }}
      npm-bundles: ${{ inputs.npm-bundles }}

  build-npm:
    if: inputs.build-npm
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/buildNpmPackage.yml@main
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      suffix: ${{ inputs.suffix }}
      artifact-name: ${{ inputs.artifact-name }}
