# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_call:
    inputs:
      suffix:
        required: false
        type: string
      version:
        description: >-
          Explicit full package version to pack (e.g. 1.1.0-beta.20260808120000). When set it wins
          over both version.props and `suffix` — use it when the caller already knows the version,
          for instance one computed from pending changesets.
        required: false
        type: string
    outputs:
      version:
        description: 'The full NuGet package version that was packed (including any prerelease suffix).'
        value: ${{ jobs.build.outputs.version }}
jobs:
  build:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - uses: microsoft/setup-kiota@v0.5.0
    - name: Restore
      run: dotnet restore
      working-directory: src
    - name: Set Version
      id: set-version
      shell: pwsh
      # Inputs go through the environment rather than `${{ }}` interpolation: expressions are pasted
      # into the script before the shell parses it, so an input carrying shell metacharacters would
      # otherwise run as code.
      env:
        INPUT_SUFFIX: ${{ inputs.suffix }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        [xml]$xml = Get-Content -path  "${{github.workspace}}/version.props" -Raw
        $version = "$($xml.Project.PropertyGroup.VersionPrefix)".Trim();
        # <VersionSuffix> is optional in a hand-written version.props, but every branch below that
        # writes a suffix needs the element to exist. Add it once up front; nothing reaches disk
        # unless a branch calls Save().
        $suffixNode = $xml.SelectSingleNode("//VersionSuffix")
        if($null -eq $suffixNode){
          $propertyGroup = $xml.SelectSingleNode("//PropertyGroup[VersionPrefix]")
          if($null -eq $propertyGroup){
            throw "version.props has no <PropertyGroup> containing <VersionPrefix>."
          }
          $suffixNode = $xml.CreateElement("VersionSuffix")
          $propertyGroup.AppendChild($suffixNode) | Out-Null
        }
        $existingSuffix = "$($suffixNode.InnerText)".Trim();
        $suffix = "$env:INPUT_SUFFIX";
        $explicit = "$env:INPUT_VERSION".Trim();
        if(![string]::IsNullOrEmpty($explicit)){
          # The caller computed the version (e.g. the next version implied by pending changesets,
          # plus a prerelease stamp). Take it verbatim and split it back into the prefix/suffix pair
          # the .NET SDK recombines at pack time.
          $dash = $explicit.IndexOf("-")
          if($dash -lt 0){
            $xml.Project.PropertyGroup.VersionPrefix = $explicit
            # Assigning "" leaves the element non-self-closing, and Save() then indents a newline
            # into it — MSBuild would read that whitespace as the suffix. Collapse it instead.
            $suffixNode.InnerText = ""
            $suffixNode.IsEmpty = $true
          }
          else{
            $xml.Project.PropertyGroup.VersionPrefix = $explicit.Substring(0, $dash)
            $suffixNode.InnerText = $explicit.Substring($dash + 1)
          }
          $xml.Save("${{github.workspace}}/version.props")
          $version = $explicit
        }
        elseif(![string]::IsNullOrEmpty($suffix)){
          $ticks=(Get-Date).Ticks;
          $version= $version+"-"+$suffix+"."+$ticks
          $suffixNode.InnerText = $suffix+"."+$ticks
          $xml.Save("${{github.workspace}}/version.props")
        }
        elseif(![string]::IsNullOrEmpty($existingSuffix)){
          # version.props already carries a prerelease suffix (e.g. changesets pre mode) — keep it.
          $version = $version+"-"+$existingSuffix
        }
        Write-Host "Package version: $version"
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src
    - name: Check for duplicate code
      uses: platisd/duplicate-code-detection-tool@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        directories: "."
      if: github.event_name == 'pull_request'
    - name: Test run
      run: dotnet test --configuration Release --logger trx --collect:"XPlat Code Coverage"
      working-directory: src
    - name: Check for coverage files
      id: check_coverage
      run: |
        if find . -path '*/TestResults/*/coverage.cobertura.xml' | grep -q .; then
          echo "has_coverage=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_coverage=false" >> "$GITHUB_OUTPUT"
        fi
    - name: ReportGenerator
      if: steps.check_coverage.outputs.has_coverage == 'true'
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.1
      with:
        reports: 'src/**/TestResults/*/coverage.cobertura.xml'
        targetdir: 'coverage-report'
        reporttypes: 'HtmlInline;MarkdownSummaryGithub'
        verbosity: 'Info'
    
    - name: Upload Coverage Report
      if: steps.check_coverage.outputs.has_coverage == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
    - name: Add Coverage PR Comment
      if: github.event_name == 'pull_request' && steps.check_coverage.outputs.has_coverage == 'true'
      run: |
        gh pr comment $PR_NUMBER --edit-last --create-if-none --body-file coverage-report/SummaryGithub.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.number }}
    
    - name: Dotnet Pack
      run: dotnet pack --configuration Release --output ../build.out/
      working-directory: src
      
    - name: Upload nuget file as build artifact      
      uses: actions/upload-artifact@v4
      with:
        name: Nuget Build Output
        path: ./build.out/  
