# This workflow will publish an npm package
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish npm
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20.x'
      registry-url:
        required: false
        type: string
        default: 'https://registry.npmjs.org'
      access:
        required: false
        type: string
        default: 'public'
    secrets:
      NPM_TOKEN:
        required: true
env:
  NpmDirectory: ${{ github.workspace }}/npm
jobs:
  Publish:

    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Download the npm package (.tgz) created by the build job
      - uses: actions/download-artifact@v4
        with:
          name: Npm Build Output
          path: ${{ env.NpmDirectory }}

      # Install the requested Node.js version and configure the registry.
      # setup-node writes the token to .npmrc via the NODE_AUTH_TOKEN env var.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      # Publish every packed tarball to the npm registry.
      # npm publish fails when the exact version already exists, so each tarball's version is
      # checked against the registry first and skipped if present. This makes the job idempotent
      # (safe to re-run) and lets it coexist with changeset releases, where a package's version
      # does not necessarily change on every release.
      - name: Publish npm package
        shell: bash
        run: |
          for package in "${NpmDirectory}"/*.tgz; do
            pj=$(tar -xzOf "${package}" package/package.json)
            name=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).name)" <<<"${pj}")
            version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)" <<<"${pj}")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
            else
              echo "Publishing ${name}@${version} (${package})"
              npm publish "${package}" --access ${{ inputs.access }}
            fi
          done
        env:
          NpmDirectory: ${{ env.NpmDirectory }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
