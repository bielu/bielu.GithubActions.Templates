# Publishes the "Nuget Build Output" artifact to nuget.org.
#
# Trusted publishing (OIDC) does NOT work from here: nuget.org requires the token's
# `job_workflow_ref` to be a workflow in the publishing repository, and for this job it is this
# file in bielu.GithubActions.Templates. Callers that want trusted publishing run the
# `.github/actions/publish-nuget` action from a job in their own workflow instead (see release.yml's
# `push-nuget` input). This workflow stays for callers that publish with the NUGET_APIKEY secret.

name: Publish
on:
  workflow_call:
    inputs:
      nuget-user:
        description: >-
          nuget.org profile name (not email) to try trusted publishing with. It can only succeed
          for this repository's own packages (see above); everywhere else NUGET_APIKEY is used.
          Set to an empty string to skip the attempt.
        required: false
        type: string
        default: 'bielu'
    secrets:
      NUGET_APIKEY:
        required: false
jobs:
  Publish:
    # No job-level `permissions:` on purpose: declaring `id-token: write` here would fail every
    # caller that does not grant it. The job inherits the caller's grant instead.
    if:  github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: bielu/bielu.GithubActions.Templates/.github/actions/publish-nuget@main
        with:
          nuget-user: ${{ inputs.nuget-user }}
          api-key: ${{ secrets.NUGET_APIKEY }}
